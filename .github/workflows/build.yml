# Builds releve on Linux, macOS and Windows, runs the kernel tests, checks the
# licence headers, the observer's conduct and the service, and attaches the
# binaries to every published release, one file per system: releve-linux,
# releve-macos, releve-windows.exe.
name: build
on:
  push:
  pull_request:
  release:
    types: [published]
permissions:
  contents: write   # a release attaches its binaries
jobs:
  build:
    strategy:
      matrix:
        # macOS by its number: the latest image of 17 October 2026 links nothing, its SDK naming
        # an architecture its linker does not know.
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: "3.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cabal update
      - run: cabal install --install-method=copy --installdir=dist --overwrite-policy=always
      - run: python tests/run.py
        env:
          RELEVE: dist/releve
      - name: name the binary after its system
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) mv dist/releve.exe dist/releve-windows.exe ;;
            macOS)   mv dist/releve dist/releve-macos ;;
            *)       mv dist/releve dist/releve-linux ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: releve-${{ matrix.os }}
          path: dist/releve-*
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/releve-*
  conduct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r observe/requirements.txt reuse && playwright install --with-deps chromium && sudo apt-get install -y -qq libnss3-tools
      - run: reuse lint
      - run: python tests/conduct.py
  survive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r observe/requirements.txt && playwright install --with-deps chromium
      # the five cases, twice, to their stored roots; the frozen order, the settle triple, no absence
      # without a clean probe 2, and no randomness, clock or locale in the record path
      - run: python tests/survive.py
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.6"
          cabal-version: "3.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cabal update && cabal install --install-method=copy --installdir=dist --overwrite-policy=always
      - run: pip install -r observe/requirements.txt && playwright install --with-deps chromium
      - run: python tests/service.py
        env:
          RELEVE: dist/releve
      - run: bash -n serve/install.sh && bash -n serve/egress.sh && shellcheck serve/install.sh serve/egress.sh receipt/build.sh
      - name: the verifier handed out is the one its sources build
        run: sh receipt/build.sh && git diff --exit-code receipt/verifier.html
